name: Aggregate and deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools
        run: npm install --no-package-lock --ignore-scripts
      - name: Validate shortlists
        run: npm test
      - name: Aggregate publisher feeds
        run: npm run aggregate
      - name: Build production CSS
        run: npm run css
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
